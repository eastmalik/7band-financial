    <meta name="description" content="Stop funding their dreams. Start funding yours. 7Band Financial Agency's 7-Level Generational Wealth Blueprint helps you restore credit, access capital, and build a tax-free legacy." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      // Frame-busting: stop this site being embedded in someone else's page
      // (clickjacking). GitHub Pages cannot send X-Frame-Options or a
      // frame-ancestors header, and frame-ancestors is ignored in a <meta>
      // tag, so this script is the available defence.
      (function () {
        try {
          if (window.self !== window.top) {
            window.top.location.replace(window.self.location.href);
          }
        } catch (e) {
          // Cross-origin parent blocked the check; hide the content instead.
          document.documentElement.style.display = "none";
          window.location.replace(window.self.location.href);
        }
      })();
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
